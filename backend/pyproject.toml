[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "nil-moneyball-backend"
version = "1.0.0"
description = "NIL Moneyball Platform Backend API"
authors = ["Devin AI <devin-ai-integration[bot]@users.noreply.github.com>"]
